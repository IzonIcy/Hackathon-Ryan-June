# One-command local stack: backend + frontend + dashboard + local vision.
#
#   docker compose up --build
#   docker compose exec ollama ollama pull llava
#
# Backend needs an .env in backend/ (copy from backend/.env.example). Twilio
# keys are optional (SMS alerts disable themselves without them).
#
# Vision points at the `ollama` service by default, so no frame leaves the
# machine and no API key is needed. Export OPENAI_BASE_URL and OPENAI_MODEL to
# use a hosted provider instead; those values win over backend/.env because
# compose interpolates them before the env_file is loaded.

services:
  backend:
    image: python:3.13-slim
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      # Auth: without a token the API only serves loopback clients. Generate:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      - FABOPS_API_TOKEN=${FABOPS_API_TOKEN:-}
      - FABOPS_DEBUG=${FABOPS_DEBUG:-0}
      # The volume below mounts a directory; point the DB into it so data
      # actually survives container recreates.
      - FABOPS_DB_PATH=/app/database/fabops.db
      # Local vision. The ollama service name only resolves on this compose
      # network, so vision.py treats it as a local endpoint.
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://ollama:11434/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-llava}
    volumes:
      - ./backend:/app
      # Keep the SQLite database across container recreates.
      - fabops-data:/app/database
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      # Model weights live here so they survive container recreates.
      - ollama-models:/root/.ollama
    ports:
      # Lets a backend running outside compose reach http://localhost:11434/v1.
      - "11434:11434"

  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  dashboard:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./dashboard:/app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  fabops-data:
  ollama-models:
