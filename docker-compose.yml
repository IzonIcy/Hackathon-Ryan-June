# One-command local stack: backend + frontend + dashboard.
#
#   docker compose up --build
#
# Backend needs an .env in backend/ (copy from backend/.env.example) with at
# least OPENAI_API_KEY for AI analysis; Twilio keys are optional (SMS alerts
# disable themselves without them).

services:
  backend:
    image: python:3.13-slim
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      # Auth: without a token the API only serves loopback clients. Generate:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      - FABOPS_API_TOKEN=${FABOPS_API_TOKEN:-}
      - FABOPS_DEBUG=${FABOPS_DEBUG:-0}
    volumes:
      - ./backend:/app
      # Keep the SQLite database across container recreates.
      - fabops-data:/app/database
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  dashboard:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./dashboard:/app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  fabops-data:
